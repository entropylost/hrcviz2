[package]
name = "twilight"
version = "0.1.0"
edition = "2024"

[dependencies]
glam = { version = "0.32.0", features = ["serde"] }
log = "0.4.29"
ordered-float = "5.5.0"
palette = "0.7.6"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
wasm-bindgen = "0.2.108"
wasm-logger = "0.2.0"
web-sys = { version = "0.3.85", features = [
    "Window",
    "Document",
    "HtmlElement",
    "MouseEvent",
    "Text",
    "HtmlCanvasElement",
    "HtmlSelectElement",
    "HtmlOptionElement",
    "HtmlInputElement",
    "CanvasRenderingContext2d",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }

[workspace]
members = ["unchecked_tests"]
