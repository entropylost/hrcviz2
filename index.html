<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link data-trunk rel="scss" href="style.scss">
		<title>HRC Visualizations</title>
	</head>
	<body>
		<canvas id="main"></canvas>
		<div id="controls">
			<label for="transmission">Reprojection mode:</label>
			<select name="transmission" id="transmission"></select>
			<br>
			<label for="frustrum-len">Frustrum length:</label>
			<input type="number" name="frustrum-len" id="frustrum-len" value="2" step="0.1" min="1" max="4">
		</div>
		<link data-trunk rel="rust" href="Cargo.toml" data-wasm-opt="z" data-bin="hrcviz2">
	</body>
</html>
